[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yeet"
version = "0.1.0"
description = "A TUI/CLI tool to completely remove macOS applications and their remnants"
readme = "README.md"
license = "PolyForm-Shield-1.0.0"
requires-python = ">=3.10"
authors = [
    { name = "Nicholas" }
]
keywords = ["macos", "uninstaller", "app-cleaner", "tui", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.50.0",
    "send2trash>=1.8.0",
    "click>=8.0.0",
    "pyfiglet>=1.0.0",
]

[project.scripts]
yeet = "yeet.__main__:main"

[project.urls]
Homepage = "https://github.com/dotbrains/yeet"
Repository = "https://github.com/dotbrains/yeet"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yeet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
